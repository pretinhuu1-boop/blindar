services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: app
  api:
    image: ghcr.io/acme/api:1.4.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
